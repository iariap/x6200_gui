    status: unverified
    note: >
      Hallazgos 24/26/27/28. El arnes calcula el contraste de cada par texto/fondo
      opaco de la pantalla real (typography_contrast). Desde UI-02 corre ademas
      sobre el dialogo About real (fixture `dialog-about`) y sobre los temas de la
