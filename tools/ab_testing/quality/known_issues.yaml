  - id: UI-007
    title: "Temas RS sin clave propia heredaban un color por debajo de 2.58:1"
    severity: major
    fixture: main-otro-tema
    status: unverified
    note: >
      Hallazgo 28. Desde UI-02 existe la fixture `main-tema-rs`: los temas RS
      renderizan y el chequeo de contraste estructural corre sobre la captura sin
      encontrar pares por debajo del umbral en la pantalla principal. El par del
      hallazgo es el riel del switch (`control_border`, la clave que RS no definia
      y heredaba a 2.58:1 contra su dialogo) y solo aparece en Ajustes, no en la
      pantalla principal; ademas el JSON ya trae la clave (hallazgo 28). Desde UI-03
      el par esta cubierto ESTATICAMENTE por `x6200-ab themes` con las parejas de
      quality/theme_pairs.yaml: resuelve la herencia del `base` como src/theme.c
      (una prueba con el RS sin `control_border` mide 2.58:1 de nuevo, o sea el
      detector funciona) y pasa en los 3 temas JSON que van en la imagen. Sigue
      unverified hasta que exista una fixture de Ajustes: el detector no es una
      captura, es el archivo del tema.
    evidence:
      - "docs/HALLAZGOS.md 28"
      - "docs/THEMES.md"
      - "tools/ui_harness/fixtures/main-tema-rs.scn"
      - "tools/ab_testing/quality/theme_pairs.yaml + tools/ab_testing/tests/test_theme_files.py (RS sin la clave: 2.58:1)"
      - "tools/ab_testing/reports/AB-e2e-structural/audit-base.json"

