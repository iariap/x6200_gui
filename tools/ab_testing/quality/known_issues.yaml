# Known issues of the X6200 UI, as the A/B framework sees them.
#
# Rule (docs/AB_TESTING_PLAN.md, and the seeds in the milestone-2 brief): an
# issue is only trusted when the *harness reproduces it*. An issue without a
# detector is a recorded hypothesis — it never fails and never passes, and stays
# listed here (and in the report) as `unverified`.
#
# Fields:
#   status:  fixed       -> was fixed before; if it shows again on B it is a REGRESSION
#            verified    -> reproducible now
#            unverified  -> recorded from the repository, no detector yet
#   detector:region_content_above  -> the region must stay near-uniform; content
#            there means the element it should hide is being drawn.
#   detector:leading_glyph_range   -> the label whose text matches `text_pattern`
#            (the power clock) must start with a code point inside `glyph_range`;
#            the text comes from the harness' structural inspection, never OCR.
#   exclusions: scoped by fixture and region, with an expiry date and a reason.
#            Never global, never permanent.

version: 1

issues:
  - id: UI-001
    title: "Etiqueta del multiplicador de tuning visible sobre la barra superior"
    severity: major
    fixture: home-usb-20m
    region: multiplicador
    status: fixed
    note: >
      ROM_REVIEW.md §5.3: la etiqueta `x%.1f` del tuning adaptativo se creaba visible y
      tapaba la barra de estado (clima/voltaje). El fix la deja con
      LV_OBJ_FLAG_HIDDEN. El arnes la reproduce: si la etiqueta se dibuja, la region
      `multiplicador` deja de ser fondo puro y el detector la marca.
    evidence:
      - "docs/ROM_REVIEW.md §5.3"
      - "src/main_screen.c: crear la etiqueta y ocultarla (LV_OBJ_FLAG_HIDDEN)"
    detector:
      kind: region_content_above
      region: multiplicador
      pixel_tolerance: 24
      max_content: 0.05
    exclusions: []

  - id: UI-009
    title: "Reloj de potencia: simbolo de bateria con puntero sin inicializar (glifos basura)"
    severity: major
    fixture: home-bateria-externa
    region: reloj_potencia
    status: fixed
    note: >
      src/clock.c, show_time() rama CLOCK_POWER: `bat_sym` se declaraba sin
      inicializar y el `switch ((uint8_t)(v_bat * 10))` solo cubria 0..100. Con
      v_bat > 10.2 (p.ej. 12.1 V con fuente externa -> 121 tras el cast) ningun
      case pisaba el puntero y `snprintf` leia la pila: glifos basura en pantalla
      ("EHE 12.1v" en las capturas del toolchain aceptado) y comportamiento
      indefinido (segfault reproducido con gcc 12 en Debian). El fix inicializa
      el puntero a LV_SYMBOL_BATTERY_FULL. El arnes lo reproduce: el detector
      `leading_glyph_range` exige que el texto del reloj arranque con un glifo de
      la familia battery (U+F2xx) y no con ASCII.
      Issue #250 (epica #249): ese reloj de potencia ya no existe —el reloj es
      permanente y la bateria vive en la banda de estado, con su icono en una
      etiqueta aparte (sony_20, gama U+F240..U+F244, en 0..10 vacio, 11..35
      nivel 1, 36..60 nivel 2, 61..85 nivel 3, 86..100 completo; `--%` y el icono
      vacio en TC(text_dim) cuando el pack no trae muestra valida)—, asi que en
      el lado B del A/B el detector no encuentra ninguna etiqueta con el patron
      `\d\.\dv\n` y la ficha queda FIXED (la cubre el test nativo del reloj, que
      exige que el icono arranque con un glifo de la familia).
    evidence:
      - "src/clock.c (show_time, CLOCK_POWER)"
      - "tools/ui_harness/fixtures/home-bateria-externa.scn"
      - "tests/native/test_clock.c"
      - "tools/ab_testing/reports/AB-e2e-ui009/"
    detector:
      kind: leading_glyph_range
      region: reloj_potencia
      text_pattern: '\d\.\dv\n'
      glyph_range: [0xF200, 0xF2FF]
    exclusions: []

  - id: UI-015
    title: "Ajustes: los switches y el slider quedan por debajo del target tactil de 44 px"
    severity: minor
    fixture: settings-wfbat
    status: verified
    note: >
      Los controles del dialogo de Ajustes son mas bajos que el target de campo
      que pide AGENTS.md (44 px): los ocho lv_switch miden 111x30 (LVGL fija el
      alto del switch) y el lv_slider del brillo del backlight 159x13. Medido con
      la inspeccion estructural del arnes (--inspect, sin OCR) sobre las dos
      fixtures nuevas. La regla `layout_touch_target` de quality/contracts.yaml los
      marca; el contrato NO se relaja: la excepcion acotada (regla+fixture, con
      fecha) los mantiene a la vista en el reporte de `contracts`/`audit` mientras
      la geometria de las filas de Ajustes este fuera del alcance de la corrida.
      Arreglar el alto de los controles (o fijar el target que la radio realmente
      usa) es el incremento de UX de Ajustes.
    evidence:
      - "tools/ui_harness/fixtures/settings-wfbat.scn (8 switches 111x30 en el grupo Espectro)"
      - "tools/ui_harness/fixtures/settings-home.scn (slider del backlight 610,373 159x13)"
      - "audit HEAD --suite visual: 8 x layout_touch_target [settings-wfbat] + 1 x layout_touch_target [settings-home]"
      - "tools/ab_testing/quality/contracts.yaml (excepcion de layout_touch_target por fixture, hasta 2027-03-31)"

  - id: UI-016
    title: "Ajustes: el campo Año recorta 4 px el valor de 4 digitos"
    severity: minor
    fixture: settings-home
    region: ajustes_anio
    status: fixed
    note: >
      La etiqueta del spinbox del año ("2026", sony_36) medía 84 px de texto y el
      area de contenido de la caja de 2 columnas (SMALL_2 = 93 menos el padding
      horizontal del textarea, 11 px por lado, y el borde) le dejaba 67: los
      ultimos 4 px del ultimo digito quedaban recortados contra el borde. Medido en
      la inspeccion estructural (text_natural.w 84 contra el box visible de 80;
      `text_overflow` NO lo veia porque mide contra el box sin recortar).
      FIX (AB-UI016-T1): en src/dialog_settings.c el campo Año baja su padding
      horizontal al de la grilla (SMALL_PAD; el padding del textarea es para el
      cursor y un spinbox no edita texto libre) y toma el ancho que piden sus 4
      cifras con la fuente vigente, medido en runtime con lv_txt_get_size (el mismo
      idioma que el resto del codigo usa para medir labels, sin un ancho clavado).
      Medido: la caja pasa de 93 a 94 px, la etiqueta queda 696,113 84x28 y su box
      visible es 84x28 (ya no se recorta); Dia y Mes no se tocan. La excepcion
      acotada de `layout_clipped` en quality/contracts.yaml se retiro en el mismo
      cambio: sin waiver, una reaparicion vuelve a fallar la corrida. El fix mueve
      pixeles solo dentro de `ajustes_anio` (regions.yaml), declarado en
      `expected_changes`.
      #110 (AB-YEAR110, 2026-10-16): ese ancho por contenido se reemplazo por la
      caja de la fila. Con la fuente vigente el helper pedia 70 px (el peor caso de
      4 cifras, "0000", mide 60 con sony_36, mas el padding de la grilla y el
      borde) y el campo quedaba 23 px mas angosto que Dia y Mes; pasa a SMALL_2 = 93
      (caja util 83, margen de 23 px para el "2026") y el helper `ancho_campo_cifras`
      se retiro, sin uso. `tests/check_settings_focus.py` comprueba que los tres
      campos de la fila declaren la misma caja.
    evidence:
      - "tools/ui_harness/fixtures/settings-home.scn"
      - "inspeccion estructural ANTES (ccfe1f5): lv_label '2026' 704,113 84x28 visible 704,113 80x28 (lost 4x0), spinbox 691,100 93x56"
      - "inspeccion estructural DESPUES (fix): lv_label '2026' 696,113 84x28 visible 696,113 84x28, spinbox 691,100 94x56"
      - "inspeccion estructural ANTES/DESPUES (#110): spinbox del ano 691,100 70x56 -> 691,100 93x56; label '2026' 696,113 60x28 (natural 60) -> 696,113 83x28"
      - "src/dialog_settings.c (el campo Año: caja SMALL_2 y pad_hor SMALL_PAD; el helper ancho_campo_cifras retirado en #110)"
      - "tests/check_settings_focus.py (los tres campos de make_date declaran la misma caja)"
      - "audit HEAD --suite visual: 0 structural findings (sin el waiver de UI-016)"
      - "tools/ab_testing/reports/AB-UI016-T1/ (capturas A/B, diff, overlay, results.json)"
      - "tools/ab_testing/reports/AB-YEAR110/ (358 px de diff en settings-home, dentro de `ajustes_anio`)"
      - "docs/evidencia/2026-10-16-year110-banco/ (captura del banco QEMU + medicion PIL)"
      - "tools/ab_testing/quality/contracts.yaml (excepcion de layout_clipped retirada; expected_change acotado a `ajustes_anio`)"

  - id: UI-017
    title: "Paneles de digitos: el \"8 fantasma\" se apila por diseno debajo del valor"
    severity: minor
    fixture: main-frecuencia-dseg
    status: verified
    note: >
      El look Casio de los paneles segmentados (issue #9, decision 1): detras del
      valor va la capa de segmentos apagados -el mismo texto con cada digito en su
      forma de 8, que es el digito que enciende los siete segmentos- a
      LV_OPA_30, en la misma caja y dibujada ANTES del valor, asi que a la vista
      solo quedan los segmentos que el valor no enciende. La regla
      `layout_overlap` de quality/contracts.yaml la mide como lo que es -dos
      etiquetas con texto visible y la misma caja, una sobre otra- y el hallazgo
      se declara con una excepcion acotada a la regla y a la fixture, con fecha,
      mientras la regla no distinga un apilado por diseno (una capa de alpha baja)
      de dos textos que se tapan: el contrato NO se relaja, el hallazgo queda a la
      vista en los reportes de `contracts`/`audit`. Solo hay una fixture en el
      corpus con familia segmentada (`digits dseg7`), y sin ella el fantasma no se
      crea (seria un digito mas). El solapamiento del reloj no llega a la regla
      porque la etiqueta del valor conserva `bg_img_src` (la imagen de la barra,
      con `bg_img_opa` en LV_OPA_TRANSP) y `_opaque` mira la presencia de la
      imagen, no su opacidad: mismo diseno, distinto camino. Eso es una
      imprecision de la regla, no una diferencia del look: el fantasma del reloj
      se ve en los pixeles (`reports/AB-FONTSE`, region `reloj_potencia`).
    evidence:
      - "tools/ui_harness/fixtures/main-frecuencia-dseg.scn (digits dseg7 + clock_view time)"
      - "src/main_screen.c (freq_shadow_update) + src/styles.h (UI_DIGIT_SHADOW_OPA = LV_OPA_30)"
      - "inspeccion estructural: lv_label sombra 150,160 500x36 opa=76 \"88.888.888\" debajo del valor \"#FFFFFF 14.074.000\""
      - "contracts HEAD: 1 x layout_overlap [main-frecuencia-dseg] (unico hallazgo, exceptuado por UI-017)"
      - "audit HEAD --suite visual: 0 structural finding(s) sobre 4037 objetos / 35 escenarios"
      - "tools/ab_testing/reports/AB-FONTSE/ (A/B 11f8d689 -> 562d3f2: main-frecuencia-dseg 4862 px en frecuencia + reloj_potencia)"
      - "tools/ab_testing/quality/contracts.yaml (excepcion de layout_overlap [main-frecuencia-dseg] hasta 2027-03-31, autor fonts-extras)"

  - id: UI-018
    title: "Indicador xN del tuning adaptativo: overlay sobre el panel del reloj de potencia"
    severity: minor
    fixture: dfl-presets-rotary0
    status: verified
    note: >
      Mientras la rueda principal gira, `src/main_screen.c` muestra la etiqueta
      `x%.1f` de la aceleracion adaptativa (se oculta sola a los 2 s con
      `hide_multiplier_cb`) alineada arriba a la derecha, -10/10, y el panel del
      reloj de potencia (`clock_style`) ocupa ese mismo rincon: 209x61 alineado
      arriba a la derecha (x=591..799, y=0..60), con la hora y la tension
      CENTRADAS en su caja. La etiqueta del indicador (sony_16) cae entonces
      dentro de la caja del reloj, en su margen derecho libre, y `layout_overlap`
      -que mide cajas de etiquetas, no tinta- la lee como dos textos apilados. A
      la vista no se tapan: en la captura el reloj conserva sus dos lineas
      (`12.1v` / `13.8v`) y el `x1.0` queda en el rincon vacio del panel. No hay
      un lugar libre en la barra superior para el indicador (izquierda: VFO/modo/
      AGC; centro: S-meter; derecha: reloj), asi que el overlay es el diseno
      vigente del indicador desde el fix de UI-001 (que lo dejo oculto por
      defecto y solo visible mientras se gira). Queda registrado, con un waiver
      acotado a la regla y a la fixture, para que el dia que el indicador se mueva
      de lugar (o que la regla distinga tinta de caja) el waiver se retire; la
      regla no se debilita. Ningun fixture del corpus lo exponia antes: las
      fixtures que giran la rueda son nuevas del #183.
    evidence:
      - "tools/ui_harness/fixtures/dfl-presets-rotary0.scn (gira rotary0 y captura con el indicador visible)"
      - "src/main_screen.c (tuning_multiplier_label: LV_ALIGN_TOP_RIGHT, -10, 10) + src/clock.c (clock_style 209x61 TOP_RIGHT)"
      - "inspeccion estructural: lv_label 'x1.0' at 769,10 dentro de la caja del lv_label del reloj at 591,0 (100% covered)"
      - "contracts HEAD: 1 x layout_overlap [dfl-presets-rotary0] (exceptuado por UI-018)"
      - "captura docs/evidencia/2026-10-20-dfl183/capturas/dfl-presets-rotary0.png: el reloj muestra sus dos lineas completas (12.1v / 13.8v) y el x1.0 queda en el margen derecho del panel"

