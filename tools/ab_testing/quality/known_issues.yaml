# Known issues of the X6200 UI, as the A/B framework sees them.
#
# Rule (docs/AB_TESTING_PLAN.md, and the seeds in the milestone-2 brief): an
# issue is only trusted when the *harness reproduces it*. An issue without a
# detector is a recorded hypothesis — it never fails and never passes, and stays
# listed here (and in the report) as `unverified`.
#
# Fields:
#   status:  fixed       -> was fixed before; if it shows again on B it is a REGRESSION
#            verified    -> reproducible now
#            unverified  -> recorded from the repository, no detector yet
#   detector:region_content_above  -> the region must stay near-uniform; content
#            there means the element it should hide is being drawn.
#   exclusions: scoped by fixture and region, with an expiry date and a reason.
#            Never global, never permanent.

version: 1

issues:
  - id: UI-001
    title: "Etiqueta del multiplicador de tuning visible sobre la barra superior"
    severity: major
    fixture: home-usb-20m
    region: multiplicador
    status: fixed
    note: >
      ROM_REVIEW.md §5.3: la etiqueta `x%.1f` del tuning adaptativo se creaba visible y
      tapaba la barra de estado (clima/voltaje). El fix la deja con
      LV_OBJ_FLAG_HIDDEN. El arnes la reproduce: si la etiqueta se dibuja, la region
      `multiplicador` deja de ser fondo puro y el detector la marca.
    evidence:
      - "docs/ROM_REVIEW.md §5.3"
      - "src/main_screen.c: crear la etiqueta y ocultarla (LV_OBJ_FLAG_HIDDEN)"
    detector:
      kind: region_content_above
      region: multiplicador
      pixel_tolerance: 24
      max_content: 0.05
    exclusions: []

  # --- Seeds from the repository history: recorded, not yet reproduced. -------
  # They stay unverified until the harness can reproduce them (pixel-region
  # detector today; structural inspection once the harness emits object bounds).

  - id: UI-002
    title: "Menu de apps: las apps solo vivian en el long-press de Ajustes"
    severity: major
    fixture: home-usb-20m
    status: unverified
