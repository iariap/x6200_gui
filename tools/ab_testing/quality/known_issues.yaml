      `settings-wfbat`, `settings-perfil`, `settings-audio`, `settings-rs-theme`) y
      sobre `bt-dialog`/`main-foco`/`apps-menu-*`: **0 hallazgos** (todos los
      controles alcanzables estan en el grupo). La regla solo corre cuando la
