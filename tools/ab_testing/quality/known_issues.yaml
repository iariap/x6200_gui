    severity: minor
    fixture: settings-wfbat
    status: verified
    note: >
      Los controles del dialogo de Ajustes son mas bajos que el target de campo
      que pide AGENTS.md (44 px): los ocho lv_switch miden 111x30 (LVGL fija el
      alto del switch) y el lv_slider del brillo del backlight 159x13. Medido con
