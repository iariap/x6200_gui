      - "tools/ui_harness/fixtures/settings-home.scn (slider del backlight 610,373 159x13)"
      - "audit HEAD --suite visual: 8 x layout_touch_target [settings-wfbat] + 1 x layout_touch_target [settings-home]"
      - "tools/ab_testing/quality/contracts.yaml (excepcion de layout_touch_target por fixture, hasta 2027-03-31)"

