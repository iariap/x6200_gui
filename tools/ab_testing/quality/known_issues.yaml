      Hallazgo 17 y 29. Sin fixture que abra el menu de apps; el arnes renderiza la
      pantalla principal, no el menu.
    evidence:
      - "docs/HALLAZGOS.md 17, 29"

  - id: UI-003
    title: "WCAG 2.1: pares texto/fondo por debajo de 4.5:1 o 3:1"
    severity: major
    fixture: home-usb-20m
    status: unverified
    note: >
      Hallazgos 24/26/27/28. Hay verificador de color (tests/check_wcag.py) pero el
      arnes todavia no expone los pares que dibuja, solo el PNG.
    evidence:
      - "docs/HALLAZGOS.md 24, 26, 27, 28"
      - "tests/check_wcag.py"

  - id: UI-004
    title: "Ajustes: widgets que no se podian alcanzar con el foco"
    severity: major
    fixture: home-usb-20m
    status: unverified
    note: >
      Hallazgo 18. El arnes no abre dialogos ni emite la grilla de foco.
    evidence:
      - "docs/HALLAZGOS.md 18"
      - "tests/check_settings_focus.py"

  - id: UI-005
    title: "Dialogo viejo: texto constante tapado por los botones"
    severity: minor
    fixture: home-usb-20m
    status: unverified
    note: >
      Hallazgo 21. Los dialogos no se abren en los fixtures actuales.
    evidence:
      - "docs/HALLAZGOS.md 21"

  - id: UI-006
    title: "Icono BT: el glifo U+F293 no existe en sony_20 (rectangulo vacio)"
    severity: minor
    fixture: home-usb-20m
    status: unverified
    note: >
      Hallazgo 19. El arnes dibuja la barra superior; falta un detector de glifos
      faltantes (la comprobacion seria sobre las fuentes, no sobre el PNG).
    evidence:
      - "docs/HALLAZGOS.md 19"
      - "src/info.c (la runa se dibuja con lv_line)"

  - id: UI-007
    title: "Temas RS sin clave propia heredaban un color por debajo de 2.58:1"
    severity: major
    fixture: main-otro-tema
    status: unverified
    note: >
      Hallazgo 28. Requiere el chequeo de contraste sobre los pares del tema, no
      disponible a nivel de pixel todavia.
    evidence:
      - "docs/HALLAZGOS.md 28"
      - "docs/THEMES.md"

  - id: UI-008
    title: "CMA: 128 MB reservados para GPU no usada (presupuesto del firmware)"
    severity: info
    fixture: home-usb-20m
    status: unverified
    note: >
      docs/RESOURCE_USAGE.md. Es un presupuesto de recursos del firmware, no un
      defecto de la UI; acota LV_MEM y buffers. El arnes no mide memoria del sistema.
    evidence:
      - "docs/RESOURCE_USAGE.md"
