# Known issues of the X6200 UI, as the A/B framework sees them.
#
# Rule (docs/AB_TESTING_PLAN.md, and the seeds in the milestone-2 brief): an
# issue is only trusted when the *harness reproduces it*. An issue without a
# detector is a recorded hypothesis — it never fails and never passes, and stays
# listed here (and in the report) as `unverified`.
#
# Fields:
#   status:  fixed       -> was fixed before; if it shows again on B it is a REGRESSION
#            verified    -> reproducible now
#            unverified  -> recorded from the repository, no detector yet
#   detector:region_content_above  -> the region must stay near-uniform; content
#            there means the element it should hide is being drawn.
#   detector:leading_glyph_range   -> the label whose text matches `text_pattern`
#            (the power clock) must start with a code point inside `glyph_range`;
#            the text comes from the harness' structural inspection, never OCR.
#   exclusions: scoped by fixture and region, with an expiry date and a reason.
#            Never global, never permanent.

version: 1

issues:
  - id: UI-001
    title: "Etiqueta del multiplicador de tuning visible sobre la barra superior"
    severity: major
    fixture: home-usb-20m
    region: multiplicador
    status: fixed
    note: >
      ROM_REVIEW.md §5.3: la etiqueta `x%.1f` del tuning adaptativo se creaba visible y
      tapaba la barra de estado (clima/voltaje). El fix la deja con
      LV_OBJ_FLAG_HIDDEN. El arnes la reproduce: si la etiqueta se dibuja, la region
      `multiplicador` deja de ser fondo puro y el detector la marca.
    evidence:
      - "docs/ROM_REVIEW.md §5.3"
      - "src/main_screen.c: crear la etiqueta y ocultarla (LV_OBJ_FLAG_HIDDEN)"
    detector:
      kind: region_content_above
      region: multiplicador
      pixel_tolerance: 24
      max_content: 0.05
    exclusions: []

  - id: UI-009
    title: "Reloj de potencia: simbolo de bateria con puntero sin inicializar (glifos basura)"
    severity: major
    fixture: home-bateria-externa
    region: reloj_potencia
    status: fixed
    note: >
      src/clock.c, show_time() rama CLOCK_POWER: `bat_sym` se declaraba sin
      inicializar y el `switch ((uint8_t)(v_bat * 10))` solo cubria 0..100. Con
      v_bat > 10.2 (p.ej. 12.1 V con fuente externa -> 121 tras el cast) ningun
      case pisaba el puntero y `snprintf` leia la pila: glifos basura en pantalla
      ("EHE 12.1v" en las capturas del toolchain aceptado) y comportamiento
      indefinido (segfault reproducido con gcc 12 en Debian). El fix inicializa
      el puntero a LV_SYMBOL_BATTERY_FULL. El arnes lo reproduce: el detector
      `leading_glyph_range` exige que el texto del reloj arranque con un glifo de
      la familia battery (U+F2xx) y no con ASCII.
    evidence:
      - "src/clock.c (show_time, CLOCK_POWER)"
      - "tools/ui_harness/fixtures/home-bateria-externa.scn"
      - "tests/native/test_clock.c"
      - "tools/ab_testing/reports/AB-e2e-ui009/"
    detector:
      kind: leading_glyph_range
      region: reloj_potencia
      text_pattern: '\d\.\dv\n'
      glyph_range: [0xF200, 0xF2FF]
    exclusions: []

  - id: UI-010
    title: "Tema Outdoor: franja de frecuencia invisible sobre fondo blanco"
    severity: critical
    fixture: main-otro-tema
    region: frecuencia
    status: fixed
    note: >
      Defecto PREEXISTENTE de la ROM en el tema Outdoor (fixture `main-otro-tema`):
      la fila de frecuencia (region `frecuencia`, main_screen.c) se pintaba blanca
      sobre fondo blanco y los digitos no se veian; la region quedaba uniforme y el
      contrato `region_min_content:frecuencia` la marcaba (content 0.0000 < 0.0200).
      Causa: `on_fg_freq_change()` y `update_freq_boundaries()` (src/main_screen.c)
      escribian el color en el markup de recolor del label (`"#%03X ..."`, con
      0xFFFFFF para el dial suelto y 0xBBBBBB con el dial trabado). Ese markup PISA
      el text_color del estilo (lv_draw_label.c: solo pinta el color del label si
      el recolor trae 6 digitos), y el tema Outdoor es claro: `bg`/`strip` son
      blancos y `text` es negro (src/theme.h, THEME_COLORS). Blanco fijo sobre
      fondo blanco = 1:1: la fila desaparecia. `freq_style`/`freq_main_style`
      (src/styles.c) cableaban ademas el mismo blanco, o sea un color muerto que
      quedaba como trampa.
      FIX (UI-04/AB-UI04-EXP3): los dos caminos piden los roles del tema
      (`theme_hex(TC_text)` para el dial suelto, `theme_hex(TC_text_soft)` —el rol
      "inactive knob / lock" de theme.h— con el dial trabado) y el formato pasa a
      `#%06X`, que es lo que LVGL exige para aceptar el parametro (con `%03X` un
      rol con un nibble alto en cero se descartaria en silencio y el texto
      volveria al color del estilo). El mismo idioma y el mismo formato que usa
      este archivo para el ATT/PRE/ATU (`"#%06X ...", theme_hex(TC_text)`). Los dos
      estilos de src/styles.c piden `TC(text)`, que es el rol que pide theme.h para
      lo que se dibuja sobre el fondo. En Outdoor los digitos
      salen negros sobre el fondo blanco y el contrato pasa. El waiver scoped de
      region de esta entrada se RETIRO en el mismo cambio: con el detector en PASS
      no hay nada que eximir. Como UI-011/UI-012 esta entrada no tiene `detector:`
      propio (su detector es la regla de contrato, que no dice donde se mueven los
      pixeles), asi que la proteccion permanente no es la clasificacion A/B sino el
      CONTRATO: sin waiver, una reaparicion de la region uniforme vuelve a fallar la
      corrida y no hay nada en el registro que la explique.
      Queda como observacion (sin detector) la cascada de ruido casi blanco sobre
      blanco y las etiquetas del strip del band plan lavadas; ninguna regla mide
      "contenido presente pero ilegible sobre el fondo" y no se inventa una.
    evidence:
      - "src/main_screen.c (on_fg_freq_change/update_freq_boundaries: theme_hex(TC_text) / TC_text_soft y `#%06X` en el markup de recolor)"
      - "src/styles.c:142,150 (freq_style/freq_main_style: TC(text) en lugar de lv_color_white())"
      - "src/theme.h THEME_COLORS (columna Outdoor: bg/strip 0xffffff, text 0x000000, text_soft 0x4a4a4a) + src/theme.c (use_builtin: builtin_colors[B_OUTDOOR])"
      - "lvgl/src/draw/lv_draw_label.c (el recolor solo aplica con 6 digitos: `i - par_start == LABEL_RECOLOR_PAR_LENGTH + 1`)"
      - "Repro (A, 4d24990, con el exclusion retirado): contracts FAIL region_min_content:frecuencia [main-otro-tema] content 0.0000 >= 0.0200"
      - "B: la misma region mide content 0.0979 y los tres labels salen text_color #000000 (inspeccion estructural, sin OCR)"
      - "tools/ab_testing/reports/AB-UI04-EXP3/ (screenshots A/B, diff, overlay, results.json)"
      - "tools/ab_testing/quality/contracts.yaml (exclusion de region retirada; expected_change acotado a `frecuencia`)"
    exclusions: []

  # --- Verified in the UI-03 audit: contract detectors, no pixel Detector. -----
  # Their detector is a contract rule over a fixture (the harness JSON and the
  # structural inspection), not one of the two pixel `detector:` kinds above, so
  # the `detector:` block is absent and the note names the rule. An open one stays
  # out of the gate with a scoped, dated exception in contracts.yaml (structural
  # findings are waived there, not in `exclusions`, which is region-scoped by
  # construction). All four were open in the UI-03 audit; each exception was
  # withdrawn when its fix landed (UI-010 in AB-UI04-EXP3, UI-011 in EXP-1,
  # UI-012 in EXP-2, UI-013 in EXP-4), so the registry carries no waiver today.

  - id: UI-011
    title: "VISION: los iconos de la barra desaparecen (glifos ausentes en el reloj y en el WiFi)"
    severity: major
    fixture: main-tema-vision
    region: barra_superior
    status: fixed
    note: >
      Con el tema VISION los glifos de icono de la barra dejan de existir: el
      reloj de potencia dibuja un rectangulo vacio en lugar del simbolo de
      bateria y el icono de WiFi desaparece. Causa: fonts_scale(VISION_FONT_STEPS)
      (src/fonts/font_select.c) escala copiando la estructura entera de una fuente
      sobre otra (*sony[i] = was[i + steps]), asi que el tamano que dibuja hereda
      tambien la cobertura de glifos del tamano con el que se reemplaza. Solo
      sony_20 y sony_30 traen los rangos de icono (su cmap llega hasta U+F244);
      los demas son ASCII (32..126). Con steps=3 sony_20 pasa a ser sony_26 y
      sony_30 pasa a ser sony_36, los dos ASCII: el reloj (src/clock.c:58 usa
      sony_30) pierde U+F240/U+F1E6 y la celda de la barra (src/styles.c:259,
      info_item_style con sony_20) pierde U+F1EB. El detector es el contrato
      `typography_missing_glyph` sobre la fixture `main-tema-vision`: la
      inspeccion estructural reporta los glifos ausentes de toda la cadena
      (nunca OCR). FIX (UI-04/AB-UI04-EXP1): fonts_scale() conserva ademas, para
      cada tamano escalado, su fuente de origen como fallback
      (`sony[i]->fallback = &was[i]`): el tamano grande dibuja el texto y el
      tamano original aporta los rangos de icono, con lo que el reloj y el WiFi
      vuelven (sin disenar iconos nuevos ni tocar el plumbing fuera de
      font_select.c).
    evidence:
      - "tools/ui_harness/fixtures/main-tema-vision.scn"
      - "src/fonts/font_select.c (fonts_scale: `sony[i]->fallback = &was[i]`) + src/fonts/sony_20.c, sony_30.c (cmap con iconos) contra sony_26.c, sony_36.c (solo 32..126)"
      - "src/clock.c:53,58 + src/styles.c:259 (los tamanos que dibujan los iconos)"
      - "audit b029907 (A): FAIL typography_missing_glyph x2 (clock U+F240/U+F1E6, WiFi U+F1EB); audit del fix (B): 0 findings"
      - "tools/ab_testing/reports/AB-UI04-EXP1/ (screenshots A/B, diff, results.json)"
      - "tools/ab_testing/quality/contracts.yaml (excepcion retirada en el mismo PR; expected_change acotado por region)"

  - id: UI-012
    title: "VISION: la etiqueta VFO-A no entra en su celda de la barra (geometria fija)"
    severity: minor
    fixture: main-tema-vision
    region: barra_superior
    status: fixed
    note: >
      Bajo VISION el texto de la barra crece tres pasos de fuente pero la celda
      no: src/info.c crea los items con posiciones y tamanos fijos
      (lv_obj_set_pos(item, x * 58 + 15, y * 22 + 5) y lv_obj_set_size(item, 56,
      26)) mientras la fuente sale de info_item_style (src/styles.c:259, sony_20,
      que VISION escala a sony_26). `VFO-A` pasaba de 48 a 66 px de ancho, no
      entraba en la celda y el WRAP la partia en dos lineas que la celda
      recortaba: en pantalla quedaba "VFO-" (text_overflow en el label de 56x26,
      WRAP). Detector: el contrato `typography_text_overflow`.
      FIX (UI-04/AB-UI04-EXP2): bajo theme_shape.vision la celda del VFO vuelve
      al tamano de los otros temas (`font_down(&sony_20, VISION_FONT_STEPS)`,
      medido: 51x17 en la celda de 56x26), el mismo idioma que NF() de
      src/cluster_column.c para sus columnas de ancho fijo y que la alternativa
      que UI_KNOWN_ISSUES ya anotaba ("VISION dibujar esa fila con el tamano de
      siempre"). Las otras cinco celdas entran con la fuente escalada y no se
      tocan; los otros temas quedan byte-identicos porque el cambio esta detras
      de theme_shape.vision. La excepcion acotada de contracts.yaml se retiro en
      el mismo cambio: sin ella, una reaparicion vuelve a fallar la corrida.
    evidence:
      - "tools/ui_harness/fixtures/main-tema-vision.scn"
      - "src/info.c (info_init: items[INFO_VFO] usa font_down(&sony_20, VISION_FONT_STEPS) bajo theme_shape.vision) + src/styles.c:259 (info_item_style)"
      - "audit 8512d86 sin la excepcion (A): FAIL typography_text_overflow [main-tema-vision] text 'VFO-A' does not fit its 56x26 box (WRAP); audit del fix: 0 findings"
      - "tools/ab_testing/reports/AB-UI04-EXP2/ (screenshots A/B, diff, overlay, results.json)"
      - "tools/ab_testing/quality/contracts.yaml (excepcion de UI-012 retirada en el mismo cambio; expected_change acotado a barra_superior)"

  - id: UI-013
    title: "params.theme_name no puede guardar un nombre de tema que el menu ofrece: la eleccion se trunca y theme_init() cae a IU1WXY"
    severity: major
    fixture: main-tema-outdoor-negative
    status: fixed
    note: >
      El menu de temas ofrece los nombres de theme_list() (src/theme.c), que
      admite hasta 31 caracteres, pero la eleccion viaja al proximo arranque
      dentro de params.theme_name, un params_str_t (src/params/types.h). Con sus
      16 bytes de antes, elegir "Outdoor-Negative" (16 caracteres) en
      Ajustes -> Display -> Theme (src/dialog_settings.c:280) guardaba
      "Outdoor-Negativ" porque params_str_set() copia sizeof(x) - 1 bytes
      (src/params/params.c) y el `theme_init(params.theme_name.x)` de src/main.c
      no lo encontraba: avisaba por stderr y caia a IU1WXY sin decirlo
      (src/theme.c:485). El mismo camino tenia el cambio de tema del long-press
      (src/main_screen.c:337) y el desplegable perdia ademas la seleccion
      actual, porque compara los nombres completos del menu contra el nombre
      truncado (src/dialog_settings.c:1727). El detector es el contrato
      `theme_name_fits_params`: el JSON de cada captura trae el `theme` que
      se renderizo y el que el store del firmware contiene (el mock usa el
      params_str_t real), y la fixture `main-tema-outdoor-negative` los separa.
      FIX (UI-04/AB-UI04-EXP4): `params_str_t.x` pasa de 16 a 32 bytes, el ancho
      que `theme_list()` admite por nombre (31 caracteres + el NUL). Es el
      cambio de raiz elegido tras descartar normalizar el menu (los JSON del
      usuario tambien admiten 31 y el store seguiria troncando) y la sola
      deteccion del fallback (el store trunco sigue sin calzar `requested`).
      El ancho es solo el buffer en RAM: no toca el esquema de params.db (tabla
      name/val, sin ancho) ni necesita migracion — un params.db del usuario se
      lee igual y `params_load_str` sigue copiando hasta sizeof(x) - 1, asi que
      la config existente no se trunca. El arnes ya renderizaba el tema pedido
      (pasa el nombre entero a theme_init) y mide el store aparte: por eso A y B
      son byte-identicos y lo que cambia es la medicion y el contrato, que pasa
      sin ninguna excepcion.
    evidence:
      - "tools/ui_harness/fixtures/main-tema-outdoor-negative.scn (JSON A cc55931: requested 'Outdoor-Negative' vs params_name 'Outdoor-Negativ', params_max_chars 15; JSON B: params_name 'Outdoor-Negative', params_max_chars 31)"
      - "src/params/types.h (params_str_t.x[32]) + src/params/params.c (params_str_set/params_load_str: sizeof(x) - 1 = 31)"
      - "src/theme.c:theme_list (admite 31) + :theme_init (el nombre ahora se encuentra; el fallback a IU1WXY queda solo para nombres que no existen)"
      - "src/dialog_settings.c:280,1727 + src/main_screen.c:337 (los dos caminos que guardan el nombre, ahora sin truncar)"
      - "tests/native/test_theme.c (test_names_fit_the_store: round-trip de 'Outdoor-Negative' y todo nombre de theme_list() contra sizeof(params_str_t.x))"
      - "contracts --revision cc55931 sin la excepcion (A): FAIL theme_name_fits_params [main-tema-outdoor-negative]; contracts del fix (B): PASS, 0 excepciones"
      - "tools/ab_testing/reports/AB-UI04-EXP4/ (screenshots A/B, diff, overlay, results.json)"
      - "tools/ab_testing/quality/contracts.yaml (excepcion de UI-013 retirada en el mismo cambio; el registro queda sin waivers)"

  - id: UI-014
    title: "VISION: la celda del modo no entra en su celda de 56 px (CW-R se pega a AUTO; USB-D se parte)"
    severity: minor
    fixture: main-tema-vision-usbd
    region: barra_superior
    status: fixed
    note: >
      Con VISION el texto de la barra crece tres pasos de fuente (fonts_scale,
      src/fonts/font_select.c) pero las seis celdas siguen siendo las 56x26 fijas
      del bitmap de la barra (src/ui_tokens.h, src/info.c). UI-012 le devolvio a la
      celda del VFO la fuente de los otros temas y la celda del modo se quedo sin
      ese tratamiento: su etiqueta se mide distinto segun el modo. `CW-R` (4
      caracteres) mide exactamente 56 px, el ancho de la celda: queda con 0 px de
      margen y se pega a la celda de AGC, que muestra "AUTO", y en pantalla se lee
      `CW-RAUTO` (esto es lo que reporta el issue #28, y lo que reproduce el
      fixture main-tema-vision-cwr, medido pixel a pixel contra la captura de la
      radio: MODE 74..127 y AUTO 131..185 en los dos). `USB-D` (el modo mas ancho
      de los que la radio lista, mode_names[] de src/remote_server.cpp) mide 66 px:
      el WRAP lo parte en dos lineas y la celda recorta la segunda, asi que la
      etiqueta desborda la caja. El detector es el contrato
      `typography_text_overflow`, y dispara sobre el fixture main-tema-vision-usbd
      (el que sobresale de la caja); `CW-R`, al medir exactamente el ancho de la
      celda, no hace wrap y el contrato (que exige que el texto crezca mas alla de
      la caja, > 56 px) no puede dispararse sobre el: el fixture cwr queda como la
      evidencia del pegado reportado. FIX (UI-04/AB-UI04-EXP5): bajo
      theme_shape.vision la celda del modo vuelve al tamano de los otros temas
      (font_down(UI_INFO_FONT, VISION_FONT_STEPS) = sony_14, el mismo idioma que
      NF() de src/cluster_column.c y que la celda del VFO de UI-012; medido: `CW-R`
      pasa de 56 a 42 px y `USB-D` de 66 a 52 px). Las otras cuatro celdas y el VFO
      no se tocan y los temas que no son VISION quedan byte-identicos, porque el
      cambio esta detras de theme_shape.vision. El contrato no lleva ninguna
      excepcion: sin waiver, una reaparicion vuelve a fallar la corrida.
    evidence:
      - "tools/ui_harness/fixtures/main-tema-vision-cwr.scn (VISION + CW-R: la etiqueta mide 56 px, 0 px de margen; el fixture del estado reportado)"
      - "tools/ui_harness/fixtures/main-tema-vision-usbd.scn (VISION + USB-D: 66 px, el fixture que dispara el contrato)"
      - "src/info.c (info_init: items[INFO_MODE] usa font_down(UI_INFO_FONT, VISION_FONT_STEPS) bajo theme_shape.vision, junto a items[INFO_VFO]) + src/ui_tokens.h UI_INFO_CELL_W=56"
      - "audit 9c031c8 (A, el commit que solo suma los fixtures): FAIL typography_text_overflow [main-tema-vision-usbd] text 'USB-D' does not fit its 56x26 box (WRAP); audit 7b644a7 (B, el fix): PASS, 0 structural findings (1572 objetos, 18 fixtures)"
      - "tools/ab_testing/reports/AB-UI04-EXP5/ (screenshots A/B, diffs y overlays de los tres fixtures VISION, results.json)"
      - "tools/ab_testing/quality/contracts.yaml (expected_change acotado a barra_superior; sin exclusion de UI-014)"
    exclusions: []

  # --- Found by the Ajustes fixture (this run): real defects of the Ajustes
