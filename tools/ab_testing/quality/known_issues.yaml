    status: fixed
    note: >
      Hallazgos 17 y 29. El defecto (las apps alcanzables solo por el long-press
      asignado, 9 de 23 con boton) se arreglo en el issue #46: las paginas APP
      pasaron a 6 y las 23 apps (22 desde que About se elimino) tienen boton. El
      arnes ahora SI abre el menu: los seis fixtures `apps-menu-1..6`
      (tools/ui_harness/fixtures/) cargan `buttons_group_app` por el mismo camino
      que la tecla APP (src/main_screen.c, KEYPAD_APP) y ciclan las seis paginas
      con el boton-pagina (src/buttons.cpp). La inspeccion estructural de los seis
      renders cubre las 22 celdas de app (con texto y caja), y `scenario_settle`
      codifica, leyendo la tabla real `buttons_group_app`, que el rotulo
      "(APP n:6)" y las apps de cada pagina son los que quedaron en la barra: una
      pagina reordenada corta la corrida en vez de capturar otra cosa y salir
      verde. No reproduce ningun defecto: la semilla pasa a `fixed` y la guarda es
      el chequeo estatico `tests/check_apps_menu.py` (23 apps, 23 en el menu, 6
      paginas) mas la codificacion del fixture.
    evidence:
