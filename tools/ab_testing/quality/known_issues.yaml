      ningun par por debajo de 4.5:1/3:1: las violaciones historicas ya estaban
      corregidas (hallazgo 24).
      VISION no entra todavia (sus fuentes escaladas muestran otros hallazgos).
      Desde UI-03 los temas JSON que van en la imagen (Holo, Material 3, RS) pasan
      ademas el chequeo ESTATICO nuevo `x6200-ab themes` con las parejas de
      quality/theme_pairs.yaml, que resuelve la herencia del `base` como
      src/theme.c.
      El verificador de la ROM (tests/check_wcag.py) sigue corriendo sobre las
      paletas y los JSON.
    evidence:
      - "docs/HALLAZGOS.md 24, 26, 27, 28"
      - "tests/check_wcag.py"
      - "tools/ab_testing/quality/theme_pairs.yaml + tools/ab_testing/tests/test_theme_files.py"
      - "tools/ui_harness/fixtures/dialog-about.scn"
      - "tools/ui_harness/fixtures/main-tema-rs.scn, main-tema-outdoor-negative.scn, main-tema-classic.scn, main-tema-holo.scn, main-tema-material-3.scn"
      - "tools/ab_testing/reports/AB-e2e-structural/audit-base.json"

