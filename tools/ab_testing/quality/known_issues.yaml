      - "tools/ab_testing/reports/AB-e2e-structural/audit-base.json"

  - id: UI-004
    title: "Ajustes: widgets que no se podian alcanzar con el foco"
    severity: major
    fixture: settings-home
    status: fixed
    note: >
      Hallazgo 18: tres widgets de Ajustes (los dos switches de Bluetooth y el
      desplegable Charger) no llamaban a `dialog_item()` y quedaban fuera de
      `keyboard_group`, sin poder alcanzarlos ni cambiarlos con las teclas. Se
      arreglaron con `dialog_item()` en los tres. El detector renderizado que
      faltaba es ahora el contrato `layout_focus_unreachable`
      (tools/ab_testing/src/x6200_ab/layout_checks.py): el inspector emite, por
      nodo, la pertenencia a `keyboard_group` (`--inspect`;
      tools/ui_harness/src/ui_inspector.c) y la regla marca todo control de una clase
      que el usuario cambia con las teclas (switch/slider/dropdown/spinbox/textarea/
      roller/checkbox/table/btn/btnmatrix) que este visible y NO este en el grupo.
      Corrida sobre los fixtures que abren Ajustes (`settings-home`,
      `settings-wfbat`, `settings-perfil`, `settings-audio`, `settings-rs-theme`) y
      sobre `bt-dialog`/`main-foco`/`apps-menu-*`: **0 hallazgos** (todos los
      controles alcanzables estan en el grupo). La regla solo corre cuando la
      captura tiene el grupo (los fixtures `main` no lo crean). Guarda permanente:
      el propio contrato (la autocprueba de `tests/test_e2e.py` quita el
      `lv_group_add_obj()` de `dialog_item()` en una revision efimera y exige el
      hallazgo) mas el chequeo estatico `tests/check_settings_focus.py` (28 widgets
      creados, 28 registrados).
    evidence:
      - "docs/HALLAZGOS.md 18"
      - "src/dialog.c (dialog_item: lv_group_add_obj(keyboard_group, obj))"
      - "tools/ui_harness/src/ui_inspector.c (in_keyboard_group por nodo + keyboard_group en la inspeccion)"
      - "tools/ab_testing/src/x6200_ab/layout_checks.py (layout_focus_unreachable)"
      - "settings-home/-wfbat/-perfil/-audio/-rs-theme + bt-dialog + main-foco: 0 hallazgos layout_focus_unreachable"
      - "tests/check_settings_focus.py"

  - id: UI-005
    title: "Dialogo viejo: texto constante tapado por los botones"
    severity: minor
    fixture: bt-dialog
    status: fixed
    note: >
      Hallazgo 21: la linea de estado del dialogo de BT (y las de WeFax/SSTV) se
      apoyaba en las constantes viejas DIALOG_H (372) / DIALOG_Y (108) y quedaba
      tapada por la fila de botones (que empieza en 480 - 62). Se arreglo con la
      geometria real (DIALOG_BOX_H 348, DIALOG_Y 66, src/styles.h). El arnes ahora
      SI renderiza el dialogo de BT: el fixture `bt-dialog`
      (tools/ui_harness/fixtures/bt-dialog.scn) abre el dialogo real por el camino
      del firmware (main_screen_start_app(ACTION_APP_BT) -> src/dialog_bt.c), con
      `btaudio-ctl` reemplazado por un mock que siembra la lista de dispositivos
      (/tmp/bt_ui_list.txt) y `system()` envuelto a un no-op
      (mocks/mock_btaudio.c). Medido con la inspeccion estructural: la linea de
      estado "no headphones, RX off" queda en y=380, 17 px de alto -> y2=396,
      ARRIBA de la fila de botones (y=418): 21 px de aire. NO reproduce el defecto.
      La semilla pasa a `fixed`; la guarda es `scenario_settle`, que exige que esa
      linea exista y que su y2 quede por encima de 418 (una reaparicion corta la
      corrida), mas el contrato `typography_text_truncated` (que ademas encontro y
      cerro un recorte real de la nota del mismo dialogo, ver la nota del NOTE_W en
      src/dialog_bt.c).
    evidence:
      - "docs/HALLAZGOS.md 21"
      - "tools/ui_harness/fixtures/bt-dialog.scn + tools/ui_harness/src/screens.c (scenario_settle: y2 de la linea de estado < 418)"
      - "src/dialog_bt.c (DIALOG_BOX_H, NOTE_W) + src/styles.h (DIALOG_BOX_H 348, DIALOG_Y 66)"
      - "tools/ui_harness/mocks/mock_btaudio.c (__wrap_system + lista sembrada)"
      - "inspeccion structural del render: 'no headphones, RX off' y2=396 < 418 (21 px)"

