  - id: UI-008
    title: "CMA: 128 MB reservados para GPU no usada (presupuesto del firmware, fuera del alcance de la UI)"
    severity: info
    fixture: home-usb-20m
    status: out-of-scope
    note: >
      docs/RESOURCE_USAGE.md. NO es un defecto de la UI: es un presupuesto de
      recursos del firmware (el pool CMA de 128 MB del DTS, atado a una GPU que el
      firmware no usa), y el arnes de UI no mide memoria del sistema. No lleva
      fixture ni fake-trick: queda `out-of-scope` declarado, con la decision escrita
      en docs/UI_KNOWN_ISSUES.md (seccion UI-008). El monitoreo queda en
      docs/RESOURCE_USAGE.md, que es donde vive el presupuesto.
    evidence:
      - "docs/RESOURCE_USAGE.md"
      - "docs/UI_KNOWN_ISSUES.md (UI-008: decision out-of-scope)"
