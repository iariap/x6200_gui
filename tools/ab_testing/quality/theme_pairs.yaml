# Pairs the *static* theme contract checks over every theme the ROM serves
# (rootfs/usr/share/x6200/themes + the built-in palettes of src/theme.h), i.e.
# the ones the user can pick in Settings.
#
# Why a separate table: the rendered typography_contrast contract only sees the
# screens the harness opens. Settings is not one of them (dialog_settings.c drags
# dialog_field.c and dozens of dependencies — UI-004), and its own pair — the
# switch/slider rail TC(control_border) against the dialog and the panel — is
# exactly the one UI-007 recorded as broken, with the value inherited from the
# theme's `base` when the file did not define it. So the pairs below are the ones
# that only exist on that screen, plus the text pairs of a dialog window.
#
# Three theme *schemas* are resolved (all against these same pairs, because all
# of them carry the 128 THEME_COLORS roles):
#   - `file`:    `<name>.json` / `<name>/theme.json` of the shipped dir, with its
#                `base` inheritance (src/theme.c theme_init).
#   - `builtin`: the four data palettes of src/theme.h THEME_COLORS(X). They are
#                the `base` a file resolves to; they are measured here too, so no
#                served theme is missing from the map.
#   - derived:   Outdoor-Negative and VISION are made at *runtime* by
#                use_builtin() (negative() over Outdoor, vision_colors[] over
#                IU1WXY). They are not data, so they are declared `unsupported`
#                below instead of re-implementing the C here.
# A theme file that ships `images` (binary PNG) paints some surfaces with the
# PNG instead of the role; the pair still measures the role and is flagged
# `binary` in the output — the pixel itself is not statically resolvable.
#
# `where` is the code that draws the pair; `min_ratio` is the WCAG 2.1 threshold
# (4.5 normal text, 3.0 large text / non-text). The roles are the names of
# THEME_COLORS(X) in src/theme.h, the same keys the JSON `colors` object uses.
#
# Colours the UI dims on purpose are NOT listed here: WCAG 1.4.3 exempts disabled
# and incidental content, so "below the threshold" is not a defect for
# btn_off_text, text_mute, text_faint, icon_off, switch_off, off and track.
# tests/check_wcag.py measures them and prints the ratios without failing; that
# stays the place for them.

pairs:
  - fg: text
    bg: dialog
    min_ratio: 4.5
    where: "dialog_field.c:534 (etiquetas de Ajustes y de los dialogos) + dialog_about.c:56-77"

  - fg: text_dim
    bg: dialog
    min_ratio: 4.5
    where: "app_frame.h:32, dialog_field.c:557 (notas y valores atenuados) + dialog_about.c:63"

  - fg: text_head
    bg: dialog
    min_ratio: 4.5
    where: "app_frame.h:31, dialog_field.c (encabezados de seccion)"

  - fg: text
    bg: panel
    min_ratio: 4.5
    where: "dialog_field.c:148-151 + 850 (valores sobre el panel de contenido)"

  - fg: text_dim
    bg: panel
    min_ratio: 4.5
    where: "dialog_field.c:557 (valores atenuados sobre el panel)"

  - fg: text
    bg: list
    min_ratio: 4.5
    where: "styles.c:240 (dialog_dropdown_list_style: las opciones de los desplegables de Ajustes)"

  # El riel del switch/slider y la perilla (styles.c styles_switch_init /
  # styles_slider_init, aplicados en los 7 lugares de dialog_settings.c). Es el
  # par del hallazgo 28: 2.58:1 cuando el tema RS no definia control_border.
  - fg: control_border
    bg: dialog
    min_ratio: 3.0
    where: "styles.c styles_switch_init/styles_slider_init (riel contra el dialogo)"

  - fg: control_border
    bg: panel
    min_ratio: 3.0
    where: "styles.c styles_switch_init/styles_slider_init (riel contra el panel)"

  - fg: panel
    bg: control_border
    min_ratio: 3.0
    where: "styles.c styles_switch_init/styles_slider_init (perilla contra el riel)"


# Themes the ROM serves whose palette this static check does NOT resolve, and
# why. They are printed as UNSUPPORTED (UNCOVERED) with the reason, so the
# coverage map has no silent hole; `--json` carries the same list. A name here
# and measured above at once is a config error (the check refuses it).
unsupported:
  - theme: "Outdoor-Negative"
    source: builtin
    reason: >
      paleta generada en runtime por use_builtin() (src/theme.c): negative() sobre
      la de Outdoor, con los roles que no se pueden invertir puestos a mano (el
      amarillo de la seleccion, el azul del VFO). Resolverla aca seria
      re-implementar ese C en Python (una segunda fuente de verdad). La cubren el
      sweep tests/check_wcag.py del propio ROM (que si deriva las nueve paletas) y
      el fixture main-tema-outdoor-negative del arnes.

  - theme: "VISION"
    source: builtin
    reason: >
      paleta generada en runtime por use_builtin() (src/theme.c): IU1WXY mas el
      array vision_colors[]. El chequeo estatico resuelve paletas de datos (la
      tabla C y los archivos), no derivaciones. La cubren tests/check_wcag.py y el
      fixture main-tema-vision.
