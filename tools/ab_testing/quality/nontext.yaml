  # --- Focus indicator: the focused field surface against the dialog ---
  # styles.c paints the focused cell with TC(focus); on settings-home the focus is
  # on the day field. The dialog is the surface it is read against.
  - name: focus_indicator
    fixture: settings-home
    theme: IU1WXY
    object: [505, 112, 86, 26]
    background: [400, 300, 40, 20]
    min_ratio: 3.0
    where: "styles.c (celda con foco, TC(focus)) contra el dialogo"

  # --- Band-plan strip markers: the CW and DIG chips against the strip ---
  # band_plan.c:19 paints the band segments with the hand-picked #3366cc (CW) and
  # #33aa55 (DIG) literals; the strip behind them is the spectrum noise.
  - name: strip_marker_cw
    fixture: main-tema-classic
    theme: Classic
    object: [250, 140, 140, 17]
    background: [250, 120, 140, 14]
    min_ratio: 3.0
