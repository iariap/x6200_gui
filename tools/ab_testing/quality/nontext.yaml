  # --- Sunlit (issue #67, THEMES v2) ---------------------------------------
  # The S-meter face is the theme-independent bitmap (top_long.bin), so a light
  # theme cannot recolour it: the arc `TC(meter_over)` has to be a light ink to
  # clear 3:1 (meter.c:116-119). Sunlit's own waterfall palette (dark navy signal
  # over a near-white floor, waterfall.c) is measured on the two fixtures that
  # render it; the column moves with the seed, so each fixture carries its rect.
  - name: s_meter_arc
    fixture: main-tema-sunlit
    theme: Sunlit
