  # --- Sprint (THEMES v2, issue #69): the same two objects, measured on the
  # theme's own golden render. Sprint ships its own waterfall table (the JSON
  # `waterfall` stops, theme.c make_palette) and its own `meter_over` (the +20/+40
  # arc over the meter's bitmap face), so the pixels answer what the static check
  # cannot: the arc and the signal column reach 3:1 with Sprint's roles.
