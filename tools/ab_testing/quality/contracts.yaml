# Quality contracts (the "C" of docs/AB_TESTING_PLAN.md): rules the candidate
# must satisfy on its own, independent of the baseline. A pixel diff of zero is
# not proof of quality; these rules are checked against B alone.
#
# Every check is derived from the capture PNG or the harness JSON, so it is
# reproducible and does not need the device.

# Minimum fraction of non-background pixels each screen region must keep. A
# component that is missing, blanked or pushed off screen drops to ~0 here even
# when the diff to A would look "small". Thresholds are deliberately coarse: the
# question is "is there content", not "did it change".
region_min_content:
  barra_superior: 0.02
  s_metro: 0.02
  espectro: 0.02
  frecuencia: 0.02
  waterfall: 0.02
  botones: 0.02

coverage:
  # The coverage table must stay honest (rule 1 of the plan): only these levels.
  allowed_levels: [REAL, PARTIAL, SYNTHETIC, UNSUPPORTED]
  # Components the main-screen fixtures must actually declare.
  required_components:
    - main_screen.c
    - theme.c
    - styles.c

# Layout rules over the harness' structural inspection (`ui_harness --inspect`):
# absolute bounding boxes, the box visible after clipping and the real widget
# class. They catch what a pixel diff cannot state.
layout:
  # Minimum touch target for an interactive control (AGENTS.md: usable field UX).
  min_touch_target_px: 44
  # Slack when comparing the visible box against the object box (rounding).
  clip_tolerance_px: 0

# Text-legibility rules, from LVGL's own font metrics and glyph resolution
# (lv_txt_get_size / lv_font_get_glyph_dsc); never OCR.
typography:
  # WCAG 2.1 contrast thresholds, normal and large text.
  min_contrast_ratio: 4.5
  large_text_min_contrast_ratio: 3.0
  large_text_px: 24
  # Icon glyphs are meant to come from the Sony fallback (the alternate fonts are
  # ASCII-only), so falling back is not a defect. A glyph missing from *every*
  # font (a placeholder box on screen) is, always.
  allow_fallback_glyphs: true

# A visual change stops being a regression only if it is a fix of a known issue
# or is listed here. Each entry needs a reason, an author and an expiry date —
# never a global, permanent exemption.
#
# Both entries below are top-bar fixes of VISION, each reproduced by a structural
# rule (`typography_missing_glyph`, `typography_text_overflow`), not by a pixel
# detector: the rule says *what* is wrong, never where the pixels move, so the fix
# cannot be explained through known_issues.yaml the way UI-001/UI-009 are. The
# region is declared here, scoped and dated like every other waiver. Several
# entries may name the same region (the top band holds two fixes) and the gate
# reads them as a set.
expected_changes:
  # AB-UI04-EXP1 (UI-011): restoring the icon glyph ranges of the scaled VISION
  # fonts redraws the power clock (region `reloj_potencia`, inside the top band)
  # and the top-bar WiFi icon, both within `barra_superior`.
  - region: barra_superior
    reason: >
      UI-011: fonts_scale() keeps the icon glyph ranges of the original slot as
      the fallback of the scaled font, so the VISION power clock and the top-bar
      icons come back. The only pixels that move are the restored glyphs inside
      the top bar; every other fixture stays byte-identical.
    author: ui04-tipografia
    until: 2027-03-31

  # AB-UI04-EXP2 (UI-012): the VFO cell of the top bar goes back to the font size
  # of the other themes, the only cell whose text did not fit the fixed 56x26 once
  # fonts_scale() widened it.
  - region: barra_superior
    reason: >
      UI-012: under VISION the VFO cell (src/info.c) draws with the font size of
      the other themes, because `VFO-A` did not fit the fixed 56x26 cell of the
      bar bitmap once fonts_scale() made it 66 px wide (it wrapped to a second
      line the cell clipped). Only the VFO cell's glyphs change, still inside the
      top bar; the other five cells and every other fixture stay byte-identical.
    author: ui04-tipografia
    until: 2027-03-31

# Changes confined to these regions are not auto-failed either: they are
# reported as REVIEW REQUIRED, because "different" there needs a human eye (an
# aesthetic change), not a machine verdict. Empty on purpose.
review_regions: []

# Scoped, dated waivers for structural findings: they name the rule and the
# fixture (optionally one node `path`) and carry a reason, an author and an
# expiry. Never global, never permanent.
#
# The last confirmed-but-open defect of the UI-03 audit (docs/UI_KNOWN_ISSUES.md,
# UI-013 — the UI-011 waiver was withdrawn in UI-04/AB-UI04-EXP1 and the UI-012 one
# in UI-04/AB-UI04-EXP2, each when its fix landed): the detector fires, the finding
# is a real one, and until the fix lands in UI-04+ it must not turn every run red —
# exactly like UI-010 does through the (region-scoped) exclusions of
# known_issues.yaml. A structural rule cannot be excluded there, so the scoped
# waiver lives here. It expires on 2027-03-31: if the defect is still there, the
# gate fails again and forces a re-evaluation.
exceptions:
  - rule: theme_name_fits_params
    fixture: main-tema-outdoor-negative
    reason: >
      UI-013: theme_list() ofrece "Outdoor-Negative" pero params.theme_name
      (params_str_t.x[16], 15 caracteres utiles) lo trunca, y theme_init() cae a
      IU1WXY en silencio. Verificado con la fixture y con la medicion del JSON
      (requested vs params_name); el fix es de UI-04+.
    author: ui03-audit-defectos
    until: 2027-03-31
