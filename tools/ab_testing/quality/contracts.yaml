# Quality contracts (the "C" of docs/AB_TESTING_PLAN.md): rules the candidate
# must satisfy on its own, independent of the baseline. A pixel diff of zero is
# not proof of quality; these rules are checked against B alone.
#
# Every check is derived from the capture PNG or the harness JSON, so it is
# reproducible and does not need the device.

# Minimum fraction of non-background pixels each screen region must keep. A
# component that is missing, blanked or pushed off screen drops to ~0 here even
# when the diff to A would look "small". Thresholds are deliberately coarse: the
# question is "is there content", not "did it change".
region_min_content:
  barra_superior: 0.02
  s_metro: 0.02
  espectro: 0.02
  frecuencia: 0.02
  waterfall: 0.02
  botones: 0.02

coverage:
  # The coverage table must stay honest (rule 1 of the plan): only these levels.
  allowed_levels: [REAL, PARTIAL, SYNTHETIC, UNSUPPORTED]
  # Components the main-screen fixtures must actually declare.
  required_components:
    - main_screen.c
    - theme.c
    - styles.c

# Layout rules over the harness' structural inspection (`ui_harness --inspect`):
# absolute bounding boxes, the box visible after clipping and the real widget
# class. They catch what a pixel diff cannot state.
layout:
  # Minimum touch target for an interactive control (AGENTS.md: usable field UX).
  min_touch_target_px: 44
  # Slack when comparing the visible box against the object box (rounding).
  clip_tolerance_px: 0

# Text-legibility rules, from LVGL's own font metrics and glyph resolution
# (lv_txt_get_size / lv_font_get_glyph_dsc); never OCR.
typography:
  # WCAG 2.1 contrast thresholds, normal and large text.
  min_contrast_ratio: 4.5
  large_text_min_contrast_ratio: 3.0
  large_text_px: 24
  # Icon glyphs are meant to come from the Sony fallback (the alternate fonts are
  # ASCII-only), so falling back is not a defect. A glyph missing from *every*
  # font (a placeholder box on screen) is, always.
  allow_fallback_glyphs: true

# A visual change stops being a regression only if it is a fix of a known issue
# or is listed here. Each entry needs a reason, an author and an expiry date —
# never a global, permanent exemption.
#
# The four entries below declare where the pixels of one fix move: UI-011,
# UI-012 and UI-014 are structural findings of VISION (`typography_missing_glyph`,
# `typography_text_overflow`), whose rule says *what* is wrong but never where
# the pixels move, and UI-010 was a pixel-region finding of the light Outdoor
# theme whose scoped exclusion was withdrawn from known_issues.yaml in the same
# change as the fix. The region is declared here, scoped and dated like every
# other waiver; several entries may name the same region (the top band holds
# three fixes) and the gate reads them as a set.
expected_changes:
  # AB-UI04-EXP1 (UI-011): restoring the icon glyph ranges of the scaled VISION
  # fonts redraws the power clock (region `reloj_potencia`, inside the top band)
  # and the top-bar WiFi icon, both within `barra_superior`.
  - region: barra_superior
    reason: >
      UI-011: fonts_scale() keeps the icon glyph ranges of the original slot as
      the fallback of the scaled font, so the VISION power clock and the top-bar
      icons come back. The only pixels that move are the restored glyphs inside
      the top bar; every other fixture stays byte-identical.
    author: ui04-tipografia
    until: 2027-03-31

  # AB-UI04-EXP2 (UI-012): the VFO cell of the top bar goes back to the font size
  # of the other themes, the only cell whose text did not fit the fixed 56x26 once
  # fonts_scale() widened it.
  - region: barra_superior
    reason: >
      UI-012: under VISION the VFO cell (src/info.c) draws with the font size of
      the other themes, because `VFO-A` did not fit the fixed 56x26 cell of the
      bar bitmap once fonts_scale() made it 66 px wide (it wrapped to a second
      line the cell clipped). Only the VFO cell's glyphs change, still inside the
      top bar; the other five cells and every other fixture stay byte-identical.
    author: ui04-tipografia
    until: 2027-03-31

  # AB-UI04-EXP3 (UI-010): the frequency row of the main screen stops writing a
  # white text colour and asks the theme for it (TC(text)), so under the light
  # Outdoor theme the digits are black on white instead of white on white.
  - region: frecuencia
    reason: >
      UI-010: the three labels of the main screen's frequency row
      (src/main_screen.c, region `frecuencia`) carried their colour in the label's
      recolor markup (`"#%03X ..."`, 0xFFFFFF) and src/styles.c wrote the same
      white as the style default, so under the light Outdoor theme the digits were
      white on the white background and the region measured content 0.0000 (the
      information was missing, not just low contrast). Both now ask the theme for
      it: `theme_hex(TC_text)` in the markup (and `TC_text_soft`, the theme's own
      "lock" role, when the dial is locked) with `#%06X`, the width LVGL requires,
      plus `TC(text)` on the two styles — the theme role the pixels are drawn on.
      So Outdoor paints them black (region `frecuencia` of
      `main-otro-tema`). The only other theme whose `text` role is not white is
      Material 3 (#e2e2e9), whose three labels move by that same 29/255 step; the
      other fourteen fixtures are byte-identical.
    author: ui04-tipografia
    until: 2027-03-31

  # AB-UI04-EXP5 (UI-014): the mode cell of the top bar also goes back to the font
  # size of the other themes under VISION, next to the VFO cell UI-012 fixed. The
  # 4-character mode `CW-R` measured exactly the cell width (0 px of margin, the
  # `CW-RAUTO` pegging of issue #28); the widest mode (`USB-D`) overflowed it.
  - region: barra_superior
    reason: >
      UI-014: the top bar's mode cell (src/info.c, items[INFO_MODE]) joins the VFO
      cell in drawing with the font size of the other themes under VISION, because
      once fonts_scale() widened the label `CW-R` it measured exactly the 56 px of
      the fixed cell (0 px of margin, which is why `CW-R` pegs to the AGC cell's
      `AUTO` and the two read as `CW-RAUTO`, the finding of issue #28) and `USB-D`
      measured 66 px and wrapped to a second line the cell clipped. Measured: `CW-R`
      goes from 56 to 42 px and `USB-D` from 66 to 52 px in the 56 px cell. The only
      pixels that move are the mode cell's glyphs inside `barra_superior` (three
      VISION fixtures: the mode cell is drawn with the smaller font whichever the
      mode), and every other fixture stays byte-identical.
    author: ui04-tipografia
    until: 2027-03-31

