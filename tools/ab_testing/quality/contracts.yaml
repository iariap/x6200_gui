# Quality contracts (the "C" of docs/AB_TESTING_PLAN.md): rules the candidate
# must satisfy on its own, independent of the baseline. A pixel diff of zero is
# not proof of quality; these rules are checked against B alone.
#
# Every check is derived from the capture PNG or the harness JSON, so it is
# reproducible and does not need the device.

# Minimum fraction of non-background pixels each screen region must keep. A
# component that is missing, blanked or pushed off screen drops to ~0 here even
# when the diff to A would look "small". Thresholds are deliberately coarse: the
# question is "is there content", not "did it change".
region_min_content:
  barra_superior: 0.02
  s_metro: 0.02
  espectro: 0.02
  frecuencia: 0.02
  waterfall: 0.02
  botones: 0.02

# La ventana modal compartida de las apps (`src/dialog.c::dialog_init` ->
# `dialog_style`, 796x348 en x2/y66 = `src/styles.h` DIALOG_BOX_H/DIALOG_Y, la misma
# caja que la region `ajustes_dialogo` de regions.yaml). Es UNA superficie opaca: lo
# que queda debajo NO es visible.
#
# Por que existe `visible_under_modal`: la intencion de `region_min_content` es "el
# componente SE ESTA DIBUJANDO (no esta en blanco)", y la mide como fraccion de
# pixeles que se apartan del color modal de la region. La ventana es una PLACA LISA:
# donde la ventana tapa una banda, esos pixeles ya no dicen nada del componente (y una
# placa lisa los hace parecer "en blanco"). Antes de #286 la ventana era translucida
# (el bitmap del tema al 95%) y el waterfall se veia a traves; al hacerla opaca (lo
# que pide la epica #284) el contenido medido en `bt-dialog-tema-redshift` cayo de
# 20.2% a 1.63% y el contrato fallaba midiendo pixeles que el usuario no ve. Medido
# sobre la parte visible, la misma fixture da 7.1%.
#
# Se aplica SOLO a las regiones declaradas en `visible_under_modal` (hoy el waterfall:
# la ventana lo cubre de y196 a y413 y las filas que quedan son el mismo waterfall).
# `barra_superior`, `s_metro` y `botones` quedan fuera de la ventana; `espectro` y
# `frecuencia` conservan contenido propio de la ventana en la parte tapada y siguen
# midiendo la region entera (su comportamiento no cambia). La presencia de la ventana
# se detecta en el arbol `--inspect` (un objeto con esa caja visible exacta y
# superficie propia: fondo opaco o la imagen del tema); sin arbol no se asume nada.
# Un waterfall realmente en blanco sigue midiendo ~0 en la parte visible: control
# negativo en `tests/test_contracts.py::test_modal_surface_does_not_hide_a_blank_region`.
modal_surface: [2, 66, 796, 348]
visible_under_modal: [waterfall]

coverage:
  # The coverage table must stay honest (rule 1 of the plan): only these levels.
  allowed_levels: [REAL, PARTIAL, SYNTHETIC, UNSUPPORTED]
  # Components the main-screen fixtures must actually declare.
  required_components:
    - main_screen.c
    - theme.c
    - styles.c

# Layout rules over the harness' structural inspection (`ui_harness --inspect`):
# absolute bounding boxes, the box visible after clipping and the real widget
# class. They catch what a pixel diff cannot state.
layout:
  # Minimum touch target for an interactive control (AGENTS.md: usable field UX).
  min_touch_target_px: 44
  # Slack when comparing the visible box against the object box (rounding).
  clip_tolerance_px: 0

# Text-legibility rules, from LVGL's own font metrics and glyph resolution
# (lv_txt_get_size / lv_font_get_glyph_dsc); never OCR.
typography:
  # WCAG 2.1 contrast thresholds, normal and large text.
  min_contrast_ratio: 4.5
  large_text_min_contrast_ratio: 3.0
  large_text_px: 24
  # Icon glyphs are meant to come from the Sony fallback (the alternate fonts are
  # ASCII-only), so falling back is not a defect. A glyph missing from *every*
  # font (a placeholder box on screen) is, always.
  allow_fallback_glyphs: true

# A visual change stops being a regression only if it is a fix of a known issue
# or is listed here. Each entry needs a reason, an author, an expiry date and the
# globs of the fixtures it covers — never a global, permanent exemption.
#
# An entry declares where the pixels of one change move: a structural finding
# (`typography_missing_glyph`, `typography_text_overflow`) says *what* is wrong
# but never where the pixels move, and a pixel-region finding has no structural
# rule at all. The region is declared here, scoped and dated like every other
# waiver, and scoped to the fixtures its own A/B measured: the gate allows a
# region only on those fixtures and the report names the entry that explained
# each change (#296).
expected_changes:
# Cada entrada declara, ademas de su region, las fixtures que cubre: una region es
# un rectangulo de la pantalla y varias pantallas lo comparten (la caja del
# dialogo de las apps es la de #296), asi que una entrada de Ajustes no puede
# explicar un cambio de otra app. Los globs son los medidos en el A/B propio de
# cada entrada, restringidos a las fixtures que la suite todavia publica; el
# porque de cada lista esta en docs/evidencia/2026-10-24-expected-changes/.
# Sin `*`: el comodin permitiria el rectangulo entero en toda fixture, que es el
# agujero que #296 cerro (lo fija tests/test_expected_changes.py).
# Las cinco entradas ancladas a VISION/RS salieron con sus fixtures (THEMES v2
# #74 retiro los temas): A define la suite, asi que esas fixtures no se comparan
# en ningun A/B y sus globs no matchearian nada. Mismo criterio que
# `test_repo_ui010_ui013_are_retired_with_their_fixtures` para known_issues.
  # AB-UI016-T1 (UI-016): the Ajustes year field stops clipping its last digit.
  - region: ajustes_anio
    fixtures: [settings-home]
    reason: >
      UI-016: el campo Año de Ajustes (src/dialog_settings.c, fila Day/Month/Year)
      dibujaba "2026" con 84 px de texto en un área de contenido de 67 (la caja de
      2 columnas con el padding horizontal del textarea) y la caja le recortaba
      los últimos 4 px contra su borde. El fix le baja el padding horizontal (el
      del cursor de un textarea, que un spinbox no usa) y le da el ancho que piden
      sus 4 cifras con la fuente vigente, medido en runtime; el campo pasa a 94x56
      y el "2026" se ve completo. Sobre la fixture settings-home solo se mueven los
      pixeles del campo, dentro de `ajustes_anio`; los otros 21 fixtures de la
      suite quedan byte-idénticos respecto de la revisión anterior al fix.
    author: ui016-year-field
    until: 2027-03-31

  # AB-YEAR110 (issue #110): the Ajustes year field gets the box of the row.
  - region: ajustes_anio
    fixtures: [settings-home]
    reason: >
      #110: en la fila Day/Month/Year el campo Año quedaba 23 px mas angosto que
      Día y Mes. Se dimensionaba por contenido (el helper `ancho_campo_cifras`, el
      fix de UI-016) y con la fuente vigente ese ancho colapsa a 70 px: el peor
      caso de 4 cifras ("0000", el '0' es la cifra mas ancha) mide 60 px y el
      padding de la grilla (3) y el borde (2) suman 10. El campo pasa a la caja de
      dos columnas de la grilla (SMALL_2 = 93), igual que Día y Mes, y conserva el
      padding de la grilla: la caja útil queda 83 y el "2026" (60 px) entra con
      23 px de margen. Sobre la fixture settings-home se mueven 358 px (el borde
      derecho del campo: de x=759 a x=782, medido por pixeles), dentro de
      `ajustes_anio`; los otros 63 fixtures de la suite quedan byte-idénticos.
    author: settings-year-110
    until: 2027-03-31

  # AB-UI08-I5 (UI-08 incr. 5): the new Ajustes row makes the grid one row taller,
  # so the scrollbar thumb of the scrolled fixture (settings-wfbat) gets shorter.
  - region: ajustes_scrollbar
    fixtures: [settings-wfbat]
    reason: >
      UI-08 incr. 5: la fila "Visual profile" (src/dialog_settings.c, grupo
      Apariencia) agrega una fila (54+5 px) al contenido de la grilla de Ajustes,
      asi que el pulgar de la barra de scroll queda mas corto. Es la unica region
      que se mueve en settings-wfbat: la fila nueva es del grupo Apariencia (no
      del Espectro que esa fixture muestra), asi que sus switches y la cascada
      detras del dialogo quedan byte-identicos. Los pixeles de la fila los captura
      la fixture nueva settings-perfil (region ajustes_perfil), que la revision A
      no tiene y por eso no aparece en el diff A/B.
    author: ui08-incr5
    until: 2027-03-31


