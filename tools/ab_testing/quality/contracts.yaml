# Changes confined to these regions are not auto-failed either: they are
# reported as REVIEW REQUIRED, because "different" there needs a human eye (an
# aesthetic change), not a machine verdict. Empty on purpose.
review_regions: []

# Scoped, dated waivers for structural findings: they name the rule and the
# fixture (optionally one node `path`) and carry a reason, an author and an
# expiry. Never global, never permanent.
#
# UI-013 was the last one for a while: `theme_list()` offers names up to 31
# characters and `params.theme_name` (a `params_str_t`, src/params/types.h) holds
# 31 too, so `theme_name_fits_params` passes on its own fixture and its waiver was
# withdrawn in UI-04/AB-UI04-EXP4, together with the fix — the same way the UI-011
# waiver went in EXP-1, UI-012 in EXP-2 and the UI-010 region exclusion in EXP-3.
# With no waiver left, a truncation that comes back fails the run again and no
# recorded issue explains it.
#
# The two below are what is left of the Ajustes window's UI-015 (UI-016 was fixed
# and its waiver withdrawn by AB-UI016-T1); see their `reason`.
exceptions:
  # Ajustes (`settings-home` / `settings-wfbat`): the REAL UI-015 defect of the
  # Ajustes window (controls below the 44px field-UX target). Each waiver is
  # scoped to one rule and one fixture (never global), carries a reason and an
  # expiry, and stays visible in the `contracts`/`audit` report; the check itself
  # is not weakened. Withdraw each one in the same change that fixes the defect.
  - rule: layout_touch_target
    fixture: settings-wfbat
    reason: >
      UI-015: the eight Ajustes switches are 111x30 — LVGL's lv_switch height —
      below the 44px field-UX target. Pre-existing row geometry of the firmware;
      the fixture change does not alter it.
    author: ajustes-fixture
    until: 2027-03-31

  - rule: layout_touch_target
    fixture: settings-home
    reason: >
      UI-015: the Ajustes backlight slider is 159x13 tall, below the 44px target.
      Same pre-existing row geometry as the switches.
    author: ajustes-fixture
