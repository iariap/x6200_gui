[project]
name = "x6200-ab"
version = "0.1.0"
description = "A/B testing framework for the X6200 UI harness (host side; never in the ROM)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.scripts]
x6200-ab = "x6200_ab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x6200_ab"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["x6200_ab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: builds the real C harness with Docker and needs the git repository",
]
